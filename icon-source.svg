<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ───── BroCode app icon ─────
       Designed for Android adaptive icons (maskable).
       The full 512x512 is filled (no transparent corners), and the important
       art lives inside the safe zone — a centered circle of radius ~205px
       (~80% of the canvas). This ensures Android's circle/squircle/rounded-square
       masks never crop the chibi.
  -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%"  stop-color="#7FA170"/>
      <stop offset="55%" stop-color="#5A8351"/>
      <stop offset="100%" stop-color="#3F6037"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#E08A7A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E08A7A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background (required for maskable) -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- halo behind face -->
  <circle cx="256" cy="256" r="190" fill="#F4E6C7" opacity="0.45"/>

  <!-- chibi face -->
  <g transform="translate(256 270) scale(2.85) translate(-50 -55)">
    <!-- hair back -->
    <ellipse cx="50" cy="34" rx="36" ry="28" fill="#7A4A2C"/>
    <!-- head -->
    <ellipse cx="50" cy="56" rx="32" ry="30" fill="#F2C7A8"/>
    <!-- chin shadow -->
    <ellipse cx="50" cy="62" rx="28" ry="22" fill="#EBB89B" opacity="0.45"/>
    <!-- blush soft -->
    <ellipse cx="32" cy="64" rx="7"  ry="4.5" fill="url(#cheek)"/>
    <ellipse cx="68" cy="64" rx="7"  ry="4.5" fill="url(#cheek)"/>
    <!-- bangs (front) -->
    <path d="M 18,46 Q 26,24 48,28 Q 72,24 82,46 Q 72,38 60,40 Q 50,34 40,40 Q 28,38 18,46 Z" fill="#7A4A2C"/>
    <!-- side tendrils -->
    <path d="M 16,52 Q 12,68 18,78" stroke="#7A4A2C" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 84,52 Q 88,68 82,78" stroke="#7A4A2C" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- happy eyes (arcs going up) -->
    <path d="M 36,60 Q 40,55 44,60" fill="none" stroke="#2A2418" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 56,60 Q 60,55 64,60" fill="none" stroke="#2A2418" stroke-width="2.4" stroke-linecap="round"/>
    <!-- big smile -->
    <path d="M 40,71 Q 50,80 60,71" fill="none" stroke="#2A2418" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- sparkles, placed inside the safe circle -->
  <g fill="#F4D78B" opacity="0.95">
    <path d="M 130 150 L 138 168 L 156 176 L 138 184 L 130 202 L 122 184 L 104 176 L 122 168 Z"/>
    <path d="M 396 140 L 402 152 L 414 158 L 402 164 L 396 176 L 390 164 L 378 158 L 390 152 Z"/>
    <circle cx="100" cy="320" r="6"/>
    <circle cx="420" cy="340" r="5"/>
    <circle cx="380" cy="420" r="7"/>
    <circle cx="140" cy="430" r="5"/>
  </g>
</svg>
